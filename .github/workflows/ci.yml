name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the supported floor in package.json engines (>=22.19.0); 24 is the current release.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single gate, defined in package.json so it runs identically locally and here:
      # `pnpm verify` = build, then `pnpm check` (format:check, lint, typecheck, test).
      - name: Verify
        run: pnpm verify
