packages:
  - "adapters/*"
  - "apps/*"
  - "engine/*"
  - "libs/*"
  - "plugins/*"

allowBuilds:
  "@biomejs/biome": true
  esbuild: true

catalog:
  # Formatting
  "@biomejs/biome": ^2.5.14

  # Linting
  "@eslint/js": ^10.0.1
  eslint: ^10.11.0
  eslint-plugin-turbo: ^2.11.2
  globals: ^17.12.0
  typescript-eslint: ^8.70.0

  # Runtime
  emittery: ^2.0.0
  exceptional-errors: ^0.4.4
  guardz: ^1.14.0
  # Pinned exactly, not ^: 0.40.5 published the day this was added, so an ordinary re-resolve
  # would otherwise pick it up before it has had time for anyone to notice if it were compromised.
  mnemonist: 0.40.4
  tslog: ^5.2.0

  # Testing
  vitest: ^4.1.11

  # TypeScript (pinned to 6.x)
  "@types/node": ^26.6.2
  type-fest: ^5.10.0
  typescript: ^6.0.3

minimumReleaseAgeExclude:
  - '@types/node@26.6.2'
  - eslint-plugin-turbo@2.11.2
  - eslint@10.11.0
